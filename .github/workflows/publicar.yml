name: Publicar portal UC15

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Executar testes
        run: npm test
      - name: Preparar somente os arquivos públicos
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Conferir páginas, recursos e versão publicada
        run: npm run verificar:publicacao
        env:
          PORTAL_URL: ${{ steps.deployment.outputs.page_url }}
